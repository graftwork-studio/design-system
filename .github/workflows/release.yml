name: Release

# On every push to main:
# - with pending changesets, open or update the "Version Packages" pull request
# - after that pull request is merged, publish to npm, tag, create GitHub
#   releases and deploy Storybook to GitHub Pages
#
# The jobs are split so only the publish job can mint an npm OIDC token, and
# the job that runs build scripts has no publishing rights at all.

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  select:
    name: Select mode
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      plan: ${{ steps.select.outputs.publish-plan-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: select
        uses: changesets/action/select-mode@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2

  version:
    name: Version Packages pull request
    needs: select
    if: needs.select.outputs.mode == 'version'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write # to approve the held CI run (see below)
      checks: read # to find the held run through its check suite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: version
        uses: changesets/action/version@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pr-title: Version Packages
          commit-message: Version Packages
      # GitHub holds CI on pull requests opened by GitHub Actions until someone
      # approves the run, so the required checks never start on their own.
      # Approve the held run for the pull request's latest commit.
      #
      # GitHub creates the held run a few seconds after the push, and the runs
      # list can lag behind the check suite, so keep looking for up to three
      # minutes: re-read the head commit each time, and find held runs both in
      # the runs list and through the commit's GitHub Actions check suites. If
      # nothing is held and nothing is running by then, fail so the stuck pull
      # request is noticed; re-running this workflow pushes a fresh commit.
      - name: Approve CI on the Version Packages pull request
        if: steps.version.outputs.pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.version.outputs.pr-number }}
        run: |
          api="repos/$GITHUB_REPOSITORY"
          deadline=$((SECONDS + 180))
          while :; do
            sha=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)

            runs=$(gh api "$api/actions/runs?head_sha=$sha&event=pull_request&per_page=100" \
              --jq '.workflow_runs[] | "\(.id) \(.status) \(.conclusion)"')
            held=$(echo "$runs" | awk '$2 == "action_required" || $3 == "action_required" { print $1 }')

            suites=$(gh api "$api/commits/$sha/check-suites?app_id=15368" \
              --jq '.check_suites[] | select(.conclusion == "action_required") | .id')
            for suite in $suites; do
              held="$held $(gh api "$api/actions/runs?check_suite_id=$suite" --jq '.workflow_runs[].id')"
            done
            held=$(echo $held | tr ' ' '\n' | sort -u)

            if [ -n "$held" ]; then
              for id in $held; do
                gh api -X POST "$api/actions/runs/$id/approve"
                echo "Approved run $id for $sha"
              done
              exit 0
            fi

            if [ -n "$runs" ] && [ -z "$suites" ]; then
              echo "CI is already running for $sha; nothing to approve."
              echo "$runs"
              exit 0
            fi

            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::No held CI run appeared for $sha on pull request #$PR within three minutes, so its required checks will not start. Re-run the Release workflow on main to push a fresh commit."
              [ -n "$suites" ] && echo "Held GitHub Actions check suites with no run: $suites"
              exit 1
            fi
            echo "No held run for $sha yet; looking again in 10 seconds."
            sleep 10
          done

  pack:
    name: Build and pack
    needs: select
    if: needs.select.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      pack: ${{ steps.pack.outputs.pack-dir-artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build packages (runs the contrast validator)
        run: pnpm --filter @graftwork/ui... build
      - id: pack
        uses: changesets/action/pack@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-plan-artifact-id: ${{ needs.select.outputs.plan }}

  publish:
    name: Publish to npm
    needs: [select, pack]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # tags and GitHub releases
      id-token: write # npm trusted publishing and provenance
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - id: publish
        uses: changesets/action/publish@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          pack-dir-artifact-id: ${{ needs.pack.outputs.pack }}
          create-github-releases: true
        env:
          # Only set for the very first publish, before trusted publishing can be
          # configured. Delete the secret afterwards; npm then uses OIDC.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # Build and deploy are separate jobs so the Pages artifact is fully available
  # before the deploy looks for it, and the build has no deploy rights.
  build-storybook:
    name: Build Storybook
    needs: publish
    if: needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Storybook
        run: pnpm --filter @graftwork/docs... build
        env:
          STORYBOOK_BASE: /design-system/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/docs/storybook-static

  storybook:
    name: Deploy Storybook to GitHub Pages
    needs: build-storybook
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
